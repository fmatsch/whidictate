[package]
name = "whidictate-inject"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
enigo = "0.6.1"

# Linux: X11 (Standard) + Wayland (wlroots/KDE: virtual keyboard, GNOME: libei) und Wayland-Zwischenablage.
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6.1", features = ["wayland", "libei_smol"] }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
