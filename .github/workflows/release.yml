name: Release
on:
  push:
    tags: ["v*"]

jobs:
  server-image:
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/server:${{ github.ref_name }},ghcr.io/${{ github.repository }}/server:latest

  client:
    permissions: { contents: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { os: macos-13, args: "--target x86_64-apple-darwin" }
          - { os: ubuntu-24.04, args: "" }
          - { os: windows-latest, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libasound2-dev libudev-dev \
            libxdo-dev libssl-dev cmake libvulkan-dev glslc libxcb1-dev libwayland-dev
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools, Glslang
          vulkan-use-cache: true
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Für signierte/notarisierte macOS-Builds hier Apple-Secrets ergänzen (APPLE_CERTIFICATE, APPLE_ID, ...).
        with:
          projectPath: apps/client
          tagName: ${{ github.ref_name }}
          releaseName: "whidictate ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
