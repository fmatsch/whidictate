name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p whidictate-core -p whidictate-server
      - run: cargo build -p whidictate-server
      - run: scripts/smoke-server.sh

  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libasound2-dev libudev-dev \
            libxdo-dev libssl-dev cmake libvulkan-dev glslc libxcb1-dev libwayland-dev
      - name: Kurzer Build-Pfad (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Der Vulkan-Shader-Build von whisper.cpp erzeugt sehr tiefe Pfade (MSBuild-Fehler FTK1011 ab 260 Zeichen).
        run: '"CARGO_TARGET_DIR=C:\t" | Out-File -FilePath $env:GITHUB_ENV -Append'
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: cargo test -p whidictate-core -p whidictate-stt -p whidictate-inject -p whidictate
