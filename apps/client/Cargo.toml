[package]
name = "whidictate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "whidictate – Diktieren mit lokalem Whisper"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
anyhow = "1.0.104"
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.3"
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1.28.0", features = ["v4"] }
whidictate-core = { version = "0.1.0", path = "../../crates/core" }
whidictate-inject = { version = "0.1.0", path = "../../crates/inject" }
whidictate-stt = { version = "0.1.0", path = "../../crates/stt" }
