[package]
name = "whidictate-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "whidictate Server – Diktate, Transkripte und Sekretariatsbearbeitung"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
whidictate-core = { version = "0.1.0", path = "../../crates/core" }
